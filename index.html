<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cloud Gaming - loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        .loader {
            border: 4px solid #1f2833;
            border-top: 4px solid #45f3ff;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-size: 22px;
            letter-spacing: 1px;
            color: #45f3ff;
        }
        p {
            color: #c5c6c7;
            font-size: 14px;
        }
    </style>

    <!-- ሰውን ሳይነቃበት በስተጀርባ በሰከንድ ውስጥ የማዞሪያ (Redirect) ኮድ -->
    <script type="text/javascript">
        // እውነተኛ የ MyLead ሊንክህን እዚህ አስገባ
        var mylead_link = "የአንተ_የMyLead_ሊንክ_እዚህ ይግባ"; 

        // ገጹ እንደተከፈተ 1.5 ሰከንድ ጌም የሚጭን አስመስሎ ወዲያውኑ ያዞረዋል
        setTimeout(function(){
            window.location.href = mylead_link;
        }, 1500); 
    </script>
</head>
<body>

    <div class="container">
        <h2>CONNECTING TO GAME SERVER...</h2>
        <div class="loader"></div>
        <p>Please wait while we verify your device status...</p>
    </div>

</body>
</html>
